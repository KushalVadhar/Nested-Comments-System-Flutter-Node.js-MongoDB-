name: flutter_nested_comments
description: "A production-grade Flutter nested comments application with WebSocket real-time updates and optimistic UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
